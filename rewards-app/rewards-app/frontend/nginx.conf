# nginx สำหรับรันในคอนเทนเนอร์แบบ http อย่างเดียว (ใช้ตอนทดสอบ)
# ของจริงให้ใช้ nginx.prod.conf ที่เปิด https เพราะหน้าสแกน QR ต้องใช้กล้อง

server {
    listen 4008;
    server_name _;

    client_max_body_size 20m;

    root  /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:4007/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://backend:4007/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router: path ไหนไม่ใช่ไฟล์จริง ให้ส่ง index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
