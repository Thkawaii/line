# nginx สำหรับ server จริง: เสิร์ฟหน้าเว็บ + ส่งต่อ API ให้ backend ในไฟล์เดียว
# server_name _ = รับทุก IP/ชื่อ จึงใช้ได้ทุกวงแลน
#
# พอร์ต 4008 = https ของหน้าเว็บ ส่วน backend 4007 คุยกันภายใน docker เท่านั้น
# ต้องเปิด https เพราะกล้องสแกน QR ใช้บน http ที่ไม่ใช่ localhost ไม่ได้

server {
    listen 4008 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/rewards.crt;
    ssl_certificate_key /etc/nginx/certs/rewards.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 20m;

    root  /usr/share/nginx/html;
    index index.html;

    # /api/xxx -> http://backend:4007/api/xxx (คง prefix ไว้ เพราะ backend ใช้ /api อยู่แล้ว)
    location /api/ {
        proxy_pass http://backend:4007/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
